<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下班啦 · Watermelon</title>
<style>
  :root {
    /* 皮肤系统：下面每个变量都可以被 SKINS 里的同名键覆盖 */
    --flesh: #FF5D73;        /* 主色：果肉红 */
    --flesh-light: #FFD0D8;  /* 主色浅 */
    --flesh-mid: #FF8A9A;    /* 主色中 */
    --rind-dark: #1F8A5B;    /* 次色：瓜皮绿 */
    --rind-light: #7BD389;
    --seed: #232323;
    --cream: #FFF9F2;
    --panel-rgb: 255, 252, 246;  /* 挂件面板底色（RGB，用于 rgba） */
    --bubble: #FFFFFF;
    --accent-soft: #FFF0F2;
    --line: #EDE7DE;
    --green-soft: #E9F7EE;
    --card-bg: #F2FBF4;
    --card-border: #D8EFDD;
    --btn-soft: #F4F0EA;
    --dog-body: #F7E6C9;
    --dog-ear: #C08A54;
    --dog-inner: #FDEFDA;
    --dog-line: #EAD3AE;
    --cheek: #FFB3C0;
    --text: #2B2B2B;
    --text-dim: #9A938B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #EFEBE3;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 16px 60px;
    color: var(--text);
  }
  .stage-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }

  /* Tauri 真挂件模式：透明背景 + 隐藏演示元素 */
  body.in-app { background: transparent; padding: 6px 8px 8px; user-select: none; overflow: hidden; }
  body.in-app .stage-hint, body.in-app .demo-row, body.in-app .demo-note { display: none; }

  /* ============ 挂件本体 ============ */
  .widget {
    width: 340px;
    background: rgba(var(--panel-rgb), .92);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(35,35,35,.18), 0 0 0 1px rgba(255,255,255,.6) inset;
    padding: 16px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  /* 顶部拖拽把手（仅真挂件模式显示） */
  .drag-bar { display: none; }

  /* ---- 紧凑模式：内容不变，占用面积约减半 ---- */
  body.in-app .widget {
    width: 100%;
    padding: 6px 12px 10px;
    border-radius: 20px;
    /* 常驻透明窗口上去掉实时模糊，GPU 开销显著下降 */
    background: rgba(var(--panel-rgb), .97);
    backdrop-filter: none;
    box-shadow: 0 8px 22px rgba(35,35,35,.2), 0 0 0 1px rgba(255,255,255,.5) inset;
    /* 用 hidden 确保圆角裁切干净；JS autoFit 会把窗口撑到足够大，不需要滚动 */
    overflow: hidden;
  }
  /* 彻底隐藏滚动条：窗口高度随内容变化，不需要用户滚动 */
  html, body, .widget, .w-scroll { scrollbar-width: none; }
  body::-webkit-scrollbar, .widget::-webkit-scrollbar, .w-scroll::-webkit-scrollbar { width: 0; height: 0; }
  /* 内容超过屏幕高度时：外层保持圆角裁切，内层滚动 */
  body.in-app .widget { display: flex; flex-direction: column; }
  .w-scroll { display: flex; flex-direction: column; min-height: 0; }
  body.in-app.capped .w-scroll { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
  body.in-app .drag-bar { display: block; height: 10px; margin: -6px -12px 2px; cursor: grab; }
  body.in-app .drag-bar:active { cursor: grabbing; }
  body.in-app .bubble { font-size: 11px; min-height: 0; height: 28px; padding: 2px 9px; line-height: 1.4; cursor: grab; overflow: hidden; }
  body.in-app .dog { width: 104px; height: 98px; }
  body.in-app .count-row { margin-top: 0; cursor: grab; }
  body.in-app .count-row > * { pointer-events: none; } /* 点空白处可直接拖窗口 */
  body.in-app .status-chip { font-size: 10px; padding: 2px 9px; margin-bottom: 2px; }
  body.in-app .daily-ring { width: 108px; height: 108px; margin: 2px auto 0; }
  body.in-app .ring-time { font-size: 17px; }
  body.in-app .ring-time .ms { font-size: 9px; }
  body.in-app .ring-label { font-size: 8px; margin-top: 2px; }
  body.in-app .ring-pct { font-size: 9px; }
  body.in-app .week-bar { margin-top: 4px; }
  body.in-app .week-bar .week-labels { font-size: 8px; margin-bottom: 1px; }
  body.in-app .week-bar .week-track { height: 8px; }
  body.in-app .week-summary { font-size: 9px; margin-top: 2px; }
  body.in-app .weekend-bar .w-track { height: 6px; }
  body.in-app .weekend-info { font-size: 9px; margin-top: 1px; }
  body.in-app .money-row { margin-top: 8px; gap: 6px; }
  body.in-app .money-card { padding: 4px 8px; border-radius: 12px; }
  body.in-app .money-card .t { font-size: 9.5px; }
  body.in-app .money-card .v { font-size: 13px; }
  body.in-app .main-btn { margin-top: 8px; padding: 9px; font-size: 13.5px; border-radius: 14px; box-shadow: none; }
  body.in-app .tool-row { margin-top: 5px; }
  body.in-app .tool-row .todo-hint { font-size: 10.5px; }
  body.in-app .icon-btn { width: 24px; height: 24px; font-size: 12px; border-radius: 8px; }

  /* 窗口不可见时暂停全部动画，避免后台空转耗电 */
  body.paused *, body.paused *::before, body.paused *::after {
    animation-play-state: paused !important;
    transition: none !important;
  }

  /* 顶部：气泡（全宽）+ 小狗（居中） */
  .pet-row { display: flex; flex-direction: column; gap: 2px; }
  .bubble {
    background: var(--bubble);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 8px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    box-shadow: 0 3px 10px rgba(35,35,35,.08);
    min-height: 38px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    transition: opacity .3s;
    position: relative; z-index: 5;
  }
  .bubble.fade { opacity: 0; }

  /* ============ 小狗动画系统（多形态多动作） ============ */
  .dog { width: 150px; height: 141px; overflow: visible; align-self: center; cursor: pointer; }
  .dog * { transform-box: fill-box; }

  /* 常驻微动作 */
  .tail { transform-origin: 0% 50%; animation: wag .65s ease-in-out infinite alternate; transition: transform .35s; }
  @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
  .breath { transform-origin: 50% 90%; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,.985); } }
  .eye { transform-origin: 50% 50%; animation: blink 4s infinite; }
  @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .gaze { transition: transform .35s; }
  .head { transform-origin: 50% 85%; animation: tilt 9s ease-in-out infinite; }
  @keyframes tilt { 0%,78%,100% { transform: rotate(0deg); } 84% { transform: rotate(-7deg); } 92% { transform: rotate(5deg); } }
  .ear-l { transform-origin: 80% 20%; animation: earL 9s ease-in-out infinite; transition: transform .35s; }
  .ear-r { transform-origin: 20% 20%; animation: earR 9s ease-in-out infinite; transition: transform .35s; }
  @keyframes earL { 0%,78%,100% { transform: rotate(0); } 84% { transform: rotate(-12deg); } 92% { transform: rotate(6deg); } }
  @keyframes earR { 0%,78%,100% { transform: rotate(0); } 84% { transform: rotate(-8deg); } 92% { transform: rotate(10deg); } }
  .tongue { opacity: 0; transition: opacity .3s; }
  .zzz, .heart, .crumb, .sweat, .snooze, .scold-mark { opacity: 0; }
  .paw-l, .paw-r { transition: opacity .25s; }

  /* 形态与道具切换 */
  .prop { opacity: 0; transition: opacity .3s; }
  .dog-sit { transition: opacity .3s; }
  .dog-lie, .dog-stand, .dog-toilet { opacity: 0; transition: opacity .3s; }
  .widget[data-act="present"] .dog-sit,
  .widget[data-act="toilet"] .dog-sit,
  .widget[data-act="sleep"] .dog-sit { opacity: 0; }
  .widget[data-act="present"] .dog-stand,
  .widget[data-act="toilet"] .dog-toilet,
  .widget[data-act="sleep"] .dog-lie { opacity: 1; }

  /* 搬砖 · 敲键盘 / 加班共用笔记本 */
  .widget[data-act="typing"] .prop-laptop,
  .widget[data-act="overtime"] .prop-laptop { opacity: 1; }
  .widget[data-act="typing"] .paw-l { animation: tapL .34s ease-in-out infinite alternate; }
  .widget[data-act="typing"] .paw-r { animation: tapR .34s ease-in-out infinite alternate .17s; }
  .widget[data-act="overtime"] .paw-l { animation: tapL .95s ease-in-out infinite alternate; }
  .widget[data-act="overtime"] .paw-r { animation: tapR .95s ease-in-out infinite alternate .45s; }
  @keyframes tapL { from { transform: translate(4px,-15px); } to { transform: translate(4px,-18px); } }
  @keyframes tapR { from { transform: translate(-4px,-15px); } to { transform: translate(-4px,-18px); } }
  .widget[data-act="typing"] .gaze, .widget[data-act="overtime"] .gaze { transform: translateY(2.2px); }
  .widget[data-act="typing"] .head { animation: typeHead 4.5s ease-in-out infinite; }
  @keyframes typeHead { 0%,100% { transform: rotate(2deg) translateY(1.5px); } 50% { transform: rotate(2.5deg) translateY(2.5px); } }

  /* 搬砖 · 做汇报 */
  .pointer-arm { transform-origin: 0% 100%; }
  .widget[data-act="present"] .pointer-arm { animation: pointTap 2.8s ease-in-out infinite; }
  @keyframes pointTap { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-6deg); } 45% { transform: rotate(0); } 60% { transform: rotate(-6deg); } 75% { transform: rotate(0); } }
  .widget[data-act="present"] .head-s { transform-origin: 50% 85%; animation: presentBob 2.8s ease-in-out infinite; }
  @keyframes presentBob { 0%,100% { transform: rotate(0); } 40% { transform: rotate(2.5deg); } }
  .widget[data-act="present"] .jaw,
  .widget[data-act="phone"] .jaw { transform-origin: 50% 0%; animation: talk .42s ease-in-out infinite; }
  @keyframes talk { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.8); } }

  /* 搬砖 · 挨骂 */
  .widget[data-act="scolded"] .head { animation: bowHead 3.6s ease-in-out infinite; }
  @keyframes bowHead {
    0%,60%,100% { transform: rotate(9deg) translateY(4px); }
    66% { transform: rotate(12deg) translateY(6.5px); }
    72% { transform: rotate(9deg) translateY(4px); }
    78% { transform: rotate(12deg) translateY(6px); }
    84% { transform: rotate(9deg) translateY(4px); }
  }
  .widget[data-act="scolded"] .ear-l { animation: none; transform: rotate(22deg); }
  .widget[data-act="scolded"] .ear-r { animation: none; transform: rotate(-22deg); }
  .widget[data-act="scolded"] .tail { animation: none; transform: rotate(-40deg); }
  .widget[data-act="scolded"] .gaze { transform: translateY(3px); }
  .widget[data-act="scolded"] .dog-sit { animation: tremble 3.6s ease-in-out infinite; }
  @keyframes tremble { 0%,7%,15%,100% { transform: translateX(0); } 9% { transform: translateX(-1.3px); } 11% { transform: translateX(1.3px); } 13% { transform: translateX(-.6px); } }
  .widget[data-act="scolded"] .scold-mark { opacity: 1; transform-origin: 50% 50%; animation: markPop 3.6s ease-out infinite; }
  @keyframes markPop { 0%,7%,16%,100% { transform: scale(0); opacity: 0; } 9% { transform: scale(1.3); opacity: 1; } 14% { transform: scale(1); opacity: 1; } }
  .widget[data-act="scolded"] .sweat,
  .widget[data-act="overtime"] .sweat { opacity: 1; animation: sweatDrop 1.8s ease-in infinite; }
  .widget[data-act="scolded"] .sweat.s2,
  .widget[data-act="overtime"] .sweat.s2 { animation-delay: .9s; }
  @keyframes sweatDrop { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(20px); opacity: 0; } }

  /* 搬砖 · 打瞌睡 */
  .widget[data-act="dozing"] .eye { animation: none; transform: scaleY(.3); }
  .widget[data-act="dozing"] .head { animation: nodOff 5s ease-in-out infinite; }
  @keyframes nodOff { 0%,70%,100% { transform: rotate(0) translateY(0); } 80% { transform: rotate(2deg) translateY(4px); } 90% { transform: rotate(0) translateY(0); } }
  .widget[data-act="dozing"] .snooze { opacity: 1; animation: zfloat2 2.4s ease-in-out infinite; }
  @keyframes zfloat2 { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px,-22px) scale(1.05); opacity: 0; } }
  .widget[data-act="dozing"] .tail { animation-duration: 1.6s; }

  /* 搬砖 · 打电话 */
  .widget[data-act="phone"] .prop-phone { opacity: 1; }
  .widget[data-act="phone"] .paw-r { opacity: 0; }
  .widget[data-act="phone"] .head { animation: phoneTalk 4s ease-in-out infinite; }
  @keyframes phoneTalk {
    0%,100% { transform: rotate(7deg) translateY(0); }
    20% { transform: rotate(7deg) translateY(2px); }
    40% { transform: rotate(7deg) translateY(0); }
    60% { transform: rotate(7deg) translateY(2px); }
    80% { transform: rotate(7deg) translateY(0); }
  }
  .widget[data-act="phone"] .ear-r { animation: none; transform: rotate(-16deg); }
  .widget[data-act="phone"] .gaze { transform: translateY(-1px); }

  /* 摸鱼 · 狗爪拿瓜 */
  .prop-melon { transform-origin: 50% 50%; transition: opacity .3s, transform .5s cubic-bezier(.34,1.56,.64,1); }
  .widget[data-act="melon"] .prop-melon { opacity: 1; transform: translate(26px,-34px) rotate(-18deg); }
  .widget[data-act="melon"] .paw-l, .widget[data-act="melon"] .paw-r { opacity: 0; }
  .widget[data-act="melon"] .head { animation: nom .55s ease-in-out infinite; }
  @keyframes nom { 0%,100% { transform: rotate(3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(2.5px); } }
  .widget[data-act="melon"] .jaw { transform-origin: 50% 0%; animation: chew .55s ease-in-out infinite; }
  @keyframes chew { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.9); } }
  .widget[data-act="melon"] .tongue { opacity: 1; }
  .widget[data-act="melon"] .tail { animation-duration: .32s; }
  .widget[data-act="melon"] .ear-l, .widget[data-act="melon"] .ear-r { animation: none; }
  .widget[data-act="melon"] .gaze { transform: translateY(-1.5px); }
  .widget[data-act="melon"] .crumb { opacity: 1; animation: drop 1.1s ease-in infinite; }
  .widget[data-act="melon"] .crumb.c2 { animation-delay: .55s; }
  @keyframes drop { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }

  /* 摸鱼 · 蹲坑刷手机 */
  .widget[data-act="toilet"] .thumb { animation: swipe 2.4s ease-in-out infinite; }
  @keyframes swipe { 0%,60%,100% { transform: translateY(0); } 72% { transform: translateY(-7px); } 84% { transform: translateY(-7px); } }
  .widget[data-act="toilet"] .leg-l { transform-origin: 50% 0%; animation: swingL 1.2s ease-in-out infinite alternate; }
  .widget[data-act="toilet"] .leg-r { transform-origin: 50% 0%; animation: swingR 1.2s ease-in-out infinite alternate; }
  @keyframes swingL { from { transform: rotate(5deg); } to { transform: rotate(-5deg); } }
  @keyframes swingR { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .widget[data-act="toilet"] .glow { opacity: .16; transition: opacity .5s; }
  .widget[data-act="toilet"] .head-t { transform-origin: 50% 85%; animation: chuckle 4.2s ease-in-out infinite; }
  @keyframes chuckle { 0%,82%,100% { transform: translateY(0); } 86% { transform: translateY(1.6px); } 90% { transform: translateY(0); } 94% { transform: translateY(1.6px); } }
  .gaze-t { transform: translateY(3px); }

  /* 加班硬撑 */
  .widget[data-act="overtime"] .head { animation: nodOff 5s ease-in-out infinite; }
  .widget[data-act="overtime"] .eye { animation: doze 5s infinite; }
  @keyframes doze { 0%,70%,100% { transform: scaleY(1); } 78%,86% { transform: scaleY(.25); } }
  .widget[data-act="overtime"] .tail { animation-duration: 1.4s; }

  /* 下班撒欢 */
  .widget[data-act="happy"] .breath { animation: hop .55s cubic-bezier(.36,0,.64,1) infinite; }
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1,1); }
    30% { transform: translateY(-14px) scale(.98,1.03); }
    55% { transform: translateY(0) scale(1.04,.94); }
    70% { transform: translateY(-4px) scale(1,1); }
  }
  .widget[data-act="happy"] .tail { animation-duration: .22s; }
  .widget[data-act="happy"] .tongue { opacity: 1; }
  .widget[data-act="happy"] .head { animation: shake .55s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .widget[data-act="happy"] .ear-l { transform-origin: 80% 20%; animation: flapL .55s ease-in-out infinite; }
  .widget[data-act="happy"] .ear-r { transform-origin: 20% 20%; animation: flapR .55s ease-in-out infinite; }
  @keyframes flapL { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
  @keyframes flapR { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-10deg); } }
  .widget[data-act="happy"] .heart { opacity: 1; animation: floatUp 1.6s ease-out infinite; }
  .widget[data-act="happy"] .heart.h2 { animation-delay: .55s; }
  .widget[data-act="happy"] .heart.h3 { animation-delay: 1.1s; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-46px) scale(1); opacity: 0; } }

  /* 周末趴睡 */
  .widget[data-act="sleep"] .zzz { opacity: 1; animation: zfloat 2.2s ease-in-out infinite; }
  .widget[data-act="sleep"] .zzz.z2 { animation-delay: .7s; font-size: 15px; }
  .widget[data-act="sleep"] .zzz.z3 { animation-delay: 1.4s; font-size: 19px; }
  @keyframes zfloat { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(14px,-30px) scale(1.15); opacity: 0; } }
  .widget[data-act="sleep"] .breath-lie { transform-origin: 50% 100%; animation: sleepBreathe 3.4s ease-in-out infinite; }
  @keyframes sleepBreathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.035,.96); } }
  .widget[data-act="sleep"] .tail-lie { transform-origin: 0% 50%; animation: wag 3s ease-in-out infinite alternate; }

  /* ============ 新增动作（25 动作库） ============ */
  /* 喝咖啡 */
  .widget[data-act="coffee"] .prop-coffee { opacity: 1; }
  .widget[data-act="coffee"] .paw-r { opacity: 0; }
  .widget[data-act="coffee"] .head { animation: sip 3.4s ease-in-out infinite; }
  @keyframes sip { 0%,55%,100% { transform: rotate(0) translateY(0); } 70% { transform: rotate(-4deg) translateY(3px); } 85% { transform: rotate(0) translateY(0); } }
  .widget[data-act="coffee"] .steam { animation: steamUp 2.2s ease-in-out infinite; }
  @keyframes steamUp { 0% { opacity: 0; transform: translateY(2px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
  .widget[data-act="coffee"] .steam.s2 { animation-delay: 1.1s; }

  /* 伸懒腰 */
  .widget[data-act="stretch"] .breath { animation: stretchUp 4.2s ease-in-out infinite; }
  @keyframes stretchUp { 0%,55%,100% { transform: scale(1,1); } 70%,82% { transform: scale(.98,1.06) translateY(-3px); } }
  .widget[data-act="stretch"] .paw-l { animation: stretchL 4.2s ease-in-out infinite; }
  .widget[data-act="stretch"] .paw-r { animation: stretchR 4.2s ease-in-out infinite; }
  @keyframes stretchL { 0%,55%,100% { transform: translate(0,0); } 70%,82% { transform: translate(8px,-16px); } }
  @keyframes stretchR { 0%,55%,100% { transform: translate(0,0); } 70%,82% { transform: translate(-8px,-16px); } }
  .widget[data-act="stretch"] .eye { animation: none; transform: scaleY(.35); }
  .widget[data-act="stretch"] .tail { animation-duration: 1.8s; }

  /* 发呆想不明白 */
  .widget[data-act="think"] .think-mark { opacity: 1; animation: markFloat 3s ease-in-out infinite; }
  @keyframes markFloat { 0%,100% { transform: translateY(0) scale(.9); opacity: .5; } 50% { transform: translateY(-4px) scale(1.1); opacity: 1; } }
  .widget[data-act="think"] .gaze { transform: translate(3px,-3px); }
  .widget[data-act="think"] .head { animation: tiltThink 4.5s ease-in-out infinite; }
  @keyframes tiltThink { 0%,100% { transform: rotate(0); } 35% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }

  /* 看文档 */
  .widget[data-act="read"] .prop-book { opacity: 1; }
  .widget[data-act="read"] .paw-l, .widget[data-act="read"] .paw-r { opacity: 0; }
  .widget[data-act="read"] .head { animation: readBob 3.6s ease-in-out infinite; }
  @keyframes readBob { 0%,100% { transform: rotate(0) translateY(2px); } 50% { transform: rotate(0) translateY(5px); } }
  .widget[data-act="read"] .gaze { transform: translateY(3px); }
  .widget[data-act="read"] .tail { animation-duration: 2.2s; }

  /* 记笔记 */
  .widget[data-act="write"] .prop-paper { opacity: 1; }
  .widget[data-act="write"] .paw-l { opacity: 0; }
  .widget[data-act="write"] .paw-r { animation: writeTap .6s ease-in-out infinite alternate; }
  @keyframes writeTap { from { transform: translate(-2px,-2px); } to { transform: translate(3px,1px); } }
  .widget[data-act="write"] .gaze { transform: translate(1px,3px); }

  /* 听歌 */
  .widget[data-act="music"] .prop-notes { opacity: 1; }
  .widget[data-act="music"] .note { animation: noteFloat 2.6s ease-in-out infinite; }
  .widget[data-act="music"] .note.n2 { animation-delay: 1.2s; }
  @keyframes noteFloat { 0% { opacity: 0; transform: translate(0,6px) scale(.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(8px,-16px) scale(1.1); } }
  .widget[data-act="music"] .head { animation: groove 1.1s ease-in-out infinite; }
  @keyframes groove { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .widget[data-act="music"] .tail { animation-duration: .55s; }

  /* 开会 */
  .widget[data-act="meeting"] .prop-bubbles { opacity: 1; }
  .widget[data-act="meeting"] .jaw { transform-origin: 50% 0%; animation: talk .5s ease-in-out infinite; }
  .widget[data-act="meeting"] .head { animation: presentBob 3.2s ease-in-out infinite; }
  .widget[data-act="meeting"] .paw-r { animation: raisePaw 4s ease-in-out infinite; }
  @keyframes raisePaw { 0%,60%,100% { transform: translate(0,0); } 72%,84% { transform: translate(-10px,-18px); } }

  /* 叹气 */
  .widget[data-act="sigh"] .sigh-mark { opacity: 1; animation: sighFloat 3.8s ease-in-out infinite; }
  @keyframes sighFloat { 0%,20% { opacity: 0; transform: translateY(0); } 35%,75% { opacity: .9; transform: translateY(-6px); } 100% { opacity: 0; transform: translateY(-12px); } }
  .widget[data-act="sigh"] .head { animation: droop 3.8s ease-in-out infinite; }
  @keyframes droop { 0%,100% { transform: translateY(0); } 40%,70% { transform: translateY(4px); } }
  .widget[data-act="sigh"] .tail { animation: none; transform: rotate(-30deg); }

  /* 疯狂赶工 */
  .widget[data-act="crunch"] .prop-laptop { opacity: 1; }
  .widget[data-act="crunch"] .paw-l { animation: tapL .18s ease-in-out infinite alternate; }
  .widget[data-act="crunch"] .paw-r { animation: tapR .18s ease-in-out infinite alternate .09s; }
  .widget[data-act="crunch"] .sweat { opacity: 1; animation: sweatDrop 1.1s ease-in infinite; }
  .widget[data-act="crunch"] .sweat.s2 { animation-delay: .55s; }
  .widget[data-act="crunch"] .head { animation: panicHead .32s ease-in-out infinite alternate; }
  @keyframes panicHead { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  .widget[data-act="crunch"] .tail { animation-duration: .25s; }

  /* 绝望发呆 */
  .widget[data-act="despair"] .prop-rain { opacity: 1; }
  .widget[data-act="despair"] .drop { animation: rainFall 1.2s linear infinite; }
  .widget[data-act="despair"] .drop.d2 { animation-delay: .4s; }
  .widget[data-act="despair"] .drop.d3 { animation-delay: .8s; }
  @keyframes rainFall { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
  .widget[data-act="despair"] .head { animation: droop 4.5s ease-in-out infinite; }
  .widget[data-act="despair"] .eye { animation: none; transform: scaleY(.45); }
  .widget[data-act="despair"] .tail { animation: none; transform: rotate(-38deg); }

  /* 刷手机 */
  .widget[data-act="scroll"] .prop-scroll { opacity: 1; }
  .widget[data-act="scroll"] .paw-l, .widget[data-act="scroll"] .paw-r { opacity: 0; }
  .widget[data-act="scroll"] .gaze { transform: translateY(3px); }
  .widget[data-act="scroll"] .head { animation: phoneGlow 3.2s ease-in-out infinite; }
  @keyframes phoneGlow { 0%,100% { transform: rotate(0) translateY(2px); } 50% { transform: rotate(1.5deg) translateY(3px); } }
  .widget[data-act="scroll"] .tail { animation-duration: 1.6s; }

  /* 偷吃零食 */
  .widget[data-act="snack"] .prop-snack { opacity: 1; }
  .widget[data-act="snack"] .paw-l { opacity: 0; }
  .widget[data-act="snack"] .jaw { transform-origin: 50% 0%; animation: chew .7s ease-in-out infinite; }
  .widget[data-act="snack"] .head { animation: nom 1.4s ease-in-out infinite; }
  .widget[data-act="snack"] .gaze { transform: translate(-2px,2px); }

  /* 趴桌小睡 */
  .widget[data-act="nap"] .dog-sit { opacity: 0; }
  .widget[data-act="nap"] .dog-lie { opacity: 1; }
  .widget[data-act="nap"] .zzz { opacity: 1; animation: zfloat 2.6s ease-in-out infinite; }
  .widget[data-act="nap"] .zzz.z2 { animation-delay: .9s; font-size: 15px; }
  .widget[data-act="nap"] .zzz.z3 { animation-delay: 1.8s; font-size: 18px; }
  .widget[data-act="nap"] .breath-lie { transform-origin: 50% 100%; animation: sleepBreathe 3.8s ease-in-out infinite; }

  /* 开心跳舞 */
  .widget[data-act="dance"] .breath { animation: danceHop .7s cubic-bezier(.36,0,.64,1) infinite; }
  @keyframes danceHop {
    0%,100% { transform: translateY(0) rotate(-3deg) scale(1,1); }
    25% { transform: translateY(-10px) rotate(3deg) scale(.98,1.02); }
    50% { transform: translateY(0) rotate(-2deg) scale(1.03,.97); }
    75% { transform: translateY(-6px) rotate(2deg) scale(1,1); }
  }
  .widget[data-act="dance"] .head { animation: shake .6s ease-in-out infinite; }
  .widget[data-act="dance"] .tail { animation-duration: .18s; }
  .widget[data-act="dance"] .heart { opacity: 1; animation: floatUp 1.4s ease-out infinite; }
  .widget[data-act="dance"] .heart.h2 { animation-delay: .45s; }
  .widget[data-act="dance"] .heart.h3 { animation-delay: .9s; }
  .widget[data-act="dance"] .ear-l { animation: flapL .6s ease-in-out infinite; }
  .widget[data-act="dance"] .ear-r { animation: flapR .6s ease-in-out infinite; }

  /* 摇尾巴庆祝 */
  .widget[data-act="wag"] .tail { animation: wagFast .14s ease-in-out infinite alternate; }
  @keyframes wagFast { from { transform: rotate(-22deg); } to { transform: rotate(28deg); } }
  .widget[data-act="wag"] .head { animation: shake 1.1s ease-in-out infinite; }
  .widget[data-act="wag"] .tongue { opacity: 1; }
  .widget[data-act="wag"] .heart { opacity: 1; animation: floatUp 1.8s ease-out infinite; }
  .widget[data-act="wag"] .heart.h2 { animation-delay: .6s; }

  /* 中部：倒计时 */
  .count-row { text-align: center; margin-top: 2px; }
  .status-chip {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 3px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--flesh); margin-bottom: 4px;
  }
  .status-chip.green { background: var(--green-soft); color: var(--rind-dark); }
  .big-time {
    font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .big-time .ms { font-size: 18px; color: var(--text-dim); }
  .big-text { font-size: 24px; font-weight: 800; }
  .count-label { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  /* ============ 当天圆环时钟 ============ */
  .daily-ring {
    width: 132px; height: 132px; margin: 4px auto 2px; position: relative;
  }
  .daily-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .daily-ring .ring-bg { stroke: var(--line); fill: none; }
  .daily-ring .ring-fg {
    stroke: var(--flesh); fill: none; stroke-linecap: round;
    transition: stroke-dashoffset .35s linear, stroke .3s;
    filter: drop-shadow(0 0 2px rgba(255,93,115,.25));
  }
  .daily-ring .ring-fg.green { stroke: var(--rind-dark); filter: none; }
  .daily-ring .ring-fg.moyu { stroke: var(--flesh-mid); }
  .daily-ring .ring-moyu { stroke: var(--flesh-light); fill: none; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    transform: rotate(0deg);
  }
  .ring-time {
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--text); line-height: 1; letter-spacing: -.3px;
  }
  .ring-time .ms { font-size: 10px; color: var(--text-dim); }
  .ring-label { font-size: 9.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.2; }
  .ring-pct { font-size: 10px; color: var(--flesh); font-weight: 700; margin-top: 1px; }

  /* ============ 一周进度条 ============ */
  .week-bar { margin-top: 6px; }
  .week-bar .week-labels {
    display: grid; grid-template-columns: repeat(7, 1fr);
    font-size: 9px; color: var(--text-dim); text-align: center;
    margin-bottom: 2px; font-variant-numeric: tabular-nums;
  }
  .week-bar .week-labels .today { color: var(--flesh); font-weight: 700; }
  .week-bar .week-track {
    height: 10px; border-radius: 6px; background: var(--line);
    display: flex; gap: 2px; overflow: hidden;
  }
  .week-bar .seg {
    flex: 1; border-radius: 3px; background: var(--line); position: relative;
  }
  .week-bar .seg.work { background: var(--green-soft); }
  .week-bar .seg.done { background: var(--rind-dark); }
  .week-bar .seg.today { background: var(--green-soft); }
  .week-bar .seg.today::after {
    content: ""; position: absolute; inset: 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--flesh-mid), var(--flesh));
  }
  .week-bar .seg.rest { background: var(--cream); opacity: .55; }
  .week-bar .seg.ot { box-shadow: 0 0 0 1px var(--flesh-mid) inset; }
  .week-summary {
    text-align: center; font-size: 10px; color: var(--text-dim);
    margin-top: 3px; font-variant-numeric: tabular-nums;
  }
  .week-summary b { color: var(--flesh); }

  /* ============ 周末倒计时进度 ============ */
  .weekend-bar { margin-top: 4px; }
  .weekend-bar .w-track {
    height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; position: relative;
  }
  .weekend-bar .w-fill {
    height: 100%; background: linear-gradient(90deg, var(--rind-light), var(--rind-dark));
    border-radius: 4px; transition: width .4s linear;
  }
  .weekend-bar .w-marker {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--flesh);
  }
  .weekend-info {
    font-size: 10.5px; color: var(--text-dim); margin-top: 2px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .weekend-info b { color: var(--rind-dark); }

  /* 迷你西瓜进度条（留作周进度条的细填充样式） */
  .bar {
    height: 14px; border-radius: 999px; margin-top: 10px;
    background: var(--green-soft);
    border: 2px solid var(--rind-dark);
    position: relative; overflow: hidden;
  }
  .bar .fill {
    position: absolute; inset: 0; width: 0%;
    background: linear-gradient(90deg, var(--flesh-mid), var(--flesh));
    border-radius: 999px;
    transition: width .3s linear;
  }
  .bar .moyu-seg { position: absolute; top: 0; bottom: 0; background: var(--flesh-light); }
  .weekend-line { text-align: center; font-size: 12.5px; margin-top: 8px; color: var(--text); }
  .weekend-line b { color: var(--flesh); }

  /* 钱 */
  .money-row { display: flex; gap: 8px; margin-top: 12px; }
  .money-card {
    flex: 1; border-radius: 16px; padding: 8px 10px; text-align: center;
    background: var(--card-bg); border: 1px solid var(--card-border);
  }
  .money-card.loss { background: var(--accent-soft); border-color: var(--flesh-light); }
  .money-card .t { font-size: 10.5px; color: var(--text-dim); }
  .money-card .v {
    font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--rind-dark); margin-top: 1px;
  }
  .money-card.loss .v { color: var(--flesh); }
  .money-card.hidden { display: none; }

  /* 主按钮：唯一的交互 */
  .main-btn {
    width: 100%; margin-top: 12px; border: none; border-radius: 18px;
    padding: 13px; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; color: #fff; background: var(--rind-dark);
    box-shadow: 0 6px 18px rgba(31,138,91,.35);
    transition: transform .12s;
  }
  .main-btn:active { transform: scale(.97); }
  .main-btn.moyu-ing { background: var(--flesh); box-shadow: 0 6px 18px rgba(255,93,115,.35); }
  .main-btn.ot-ing { background: var(--flesh-mid); color: #fff; box-shadow: 0 6px 18px rgba(255,138,154,.3); }

  /* 底部工具行 */
  .tool-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .tool-row .todo-hint { font-size: 11.5px; color: var(--text-dim); }
  .tool-row .todo-hint b { color: var(--flesh); }
  .icon-btn {
    border: none; background: var(--btn-soft); border-radius: 10px;
    width: 30px; height: 30px; cursor: pointer; font-size: 14px; color: var(--text-dim);
  }

  /* 抽屉（设置 / 待办）— 圆角内卡片，与主 widget 视觉统一 */
  .drawer {
    display: none;
    margin-top: 10px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px 14px;
    background: rgba(var(--panel-rgb), .55);
  }
  .drawer.open { display: block; }
  .drawer h3 { font-size: 13px; margin-bottom: 8px; }
  .field label { font-size: 11.5px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .drawer input[type=time], .drawer input[type=number] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 9px;
    font-size: 13px; font-family: inherit; background: var(--cream);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .wd-row { display: flex; gap: 4px; margin-bottom: 10px; }
  .wd-btn {
    flex: 1; border: 1.5px solid var(--line); background: var(--cream); border-radius: 8px;
    padding: 6px 0; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-dim);
  }
  .wd-btn.on { background: var(--rind-dark); border-color: var(--rind-dark); color: #fff; }
  .seg-row { display: flex; gap: 4px; }
  .seg-btn {
    flex: 1; border: 1.5px solid var(--line); background: var(--cream); border-radius: 8px;
    padding: 6px 0; font-size: 11px; cursor: pointer; font-family: inherit; color: var(--text-dim);
  }
  .seg-btn.on { background: var(--flesh); border-color: var(--flesh); color: #fff; font-weight: 700; }
  .ov-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn {
    border: 1.5px solid var(--line); background: var(--cream); border-radius: 999px;
    padding: 5px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .chip-btn.on { background: var(--seed); color: #fff; border-color: var(--seed); }
  ul.todo-list { list-style: none; }
  ul.todo-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  ul.todo-list li:last-child { border-bottom: none; }
  ul.todo-list li.done .t { text-decoration: line-through; color: var(--text-dim); }
  ul.todo-list input[type=checkbox] { accent-color: var(--rind-dark); }
  ul.todo-list .t { flex: 1; }
  ul.todo-list .del { border: none; background: none; color: var(--text-dim); cursor: pointer; }
  .todo-add { display: flex; gap: 6px; margin-bottom: 6px; }
  .todo-add input { flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 12.5px; font-family: inherit; background: var(--cream); }
  .todo-add button { border: none; border-radius: 10px; background: var(--rind-dark); color: #fff; padding: 0 12px; cursor: pointer; font-family: inherit; }

  /* 皮肤选择：一行色块，点一下整只瓜换装 */
  .skin-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .skin-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 1.5px solid var(--line); background: var(--cream); border-radius: 10px;
    padding: 5px 2px 4px; cursor: pointer; font-family: inherit;
  }
  .skin-btn.on { border-color: var(--flesh); background: var(--accent-soft); }
  .skin-swatch { width: 26px; height: 20px; border-radius: 7px; box-shadow: 0 0 0 1px rgba(0,0,0,.06) inset; }
  .skin-name { font-size: 9.5px; color: var(--text-dim); line-height: 1.1; white-space: nowrap; }
  .skin-btn.on .skin-name { color: var(--flesh); font-weight: 700; }

  /* 演示时间机 */
  .demo-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
  .demo-note { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 6px; }

  /* ============ 首次引导遮罩 ============ */
  .onboarding {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(35,35,35,.45); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .onboarding.show { display: flex; }
  .ob-card {
    width: 360px; max-width: 92vw; background: var(--cream); border-radius: 24px; padding: 26px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .ob-card h2 { font-size: 19px; margin-bottom: 4px; }
  .ob-card .ob-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; }
  .ob-card .field { margin-bottom: 14px; }
  .ob-card input[type=number], .ob-card input[type=time] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 15px; font-family: inherit; background: var(--bubble); color: var(--text);
  }
  /* 真挂件里引导卡贴合小窗 */
  body.in-app .onboarding { padding: 10px; }
  body.in-app .ob-card { width: 100%; padding: 18px 16px; border-radius: 18px; }
  body.in-app .ob-card h2 { font-size: 17px; }
  body.in-app .ob-card .ob-sub { font-size: 12px; margin-bottom: 12px; }
  .ob-actions { display: flex; gap: 10px; margin-top: 18px; }
  .ob-actions .main-btn { margin-top: 0; }
  .ob-skip { flex: 0 0 auto; border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; font-family: inherit; padding: 0 6px; }
</style>
</head>
<body>

<div class="stage-hint">↓ 这就是未来常驻桌面的挂件形态（340px 小窗演示）</div>

<!-- ================= 挂件 ================= -->
<div class="widget" id="widget" data-act="typing">

  <div class="drag-bar" data-tauri-drag-region title="按住拖动窗口"></div>

  <!-- 滚动容器：窗口触顶时内部滚动，圆角仍由外层 .widget 负责裁切 -->
  <div class="w-scroll" id="wScroll">

  <div class="pet-row">
    <div class="bubble" id="bubble" data-tauri-drag-region>…</div>
    <!-- 小狗桌宠：爱吃西瓜的奶油色小狗（坐姿/站姿/蹲坑/趴睡四形态） -->
    <svg class="dog" viewBox="0 0 160 150" id="dogSvg" title="点我换个动作">
      <!-- 坐姿形态 -->
      <g class="dog-sit">
        <path class="tail" d="M118 104 Q 138 96 140 78" fill="none" stroke="var(--dog-ear)" stroke-width="9" stroke-linecap="round"/>
        <g class="breath">
          <ellipse cx="80" cy="112" rx="42" ry="32" fill="var(--dog-body)"/>
          <ellipse cx="80" cy="120" rx="26" ry="18" fill="var(--dog-inner)"/>
          <ellipse class="paw-l" cx="62" cy="138" rx="11" ry="7" fill="var(--dog-body)" stroke="var(--dog-line)" stroke-width="1.5"/>
          <ellipse class="paw-r" cx="98" cy="138" rx="11" ry="7" fill="var(--dog-body)" stroke="var(--dog-line)" stroke-width="1.5"/>
          <!-- 笔记本电脑 -->
          <g class="prop prop-laptop">
            <rect x="48" y="126" width="64" height="5.5" rx="2.75" fill="#C7CBD6" stroke="#AEB4C2" stroke-width="1"/>
            <rect x="54" y="94" width="52" height="33" rx="5" fill="#E9EBF1" stroke="#C4C9D4" stroke-width="1.5"/>
            <path d="M73 108 A7 7 0 0 0 87 108 Z" fill="var(--flesh)"/>
            <path d="M73 108 A7 7 0 0 0 87 108" fill="none" stroke="var(--rind-dark)" stroke-width="2" stroke-linecap="round"/>
          </g>
          <!-- 头 -->
          <g class="head">
            <path class="ear-l" d="M52 40 Q 30 44 32 70 Q 46 66 54 52 Z" fill="var(--dog-ear)"/>
            <path class="ear-r" d="M108 40 Q 130 44 128 70 Q 114 66 106 52 Z" fill="var(--dog-ear)"/>
            <circle cx="80" cy="58" r="34" fill="var(--dog-body)"/>
            <ellipse cx="56" cy="68" rx="6.5" ry="4" fill="var(--cheek)" opacity=".55"/>
            <ellipse cx="104" cy="68" rx="6.5" ry="4" fill="var(--cheek)" opacity=".55"/>
            <g class="gaze">
              <g class="eye"><circle cx="66" cy="54" r="4.2" fill="var(--seed)"/><circle cx="67.5" cy="52.5" r="1.4" fill="#fff"/></g>
              <g class="eye"><circle cx="94" cy="54" r="4.2" fill="var(--seed)"/><circle cx="95.5" cy="52.5" r="1.4" fill="#fff"/></g>
