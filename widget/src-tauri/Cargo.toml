[package]
name = "watermelon-widget"
version = "0.1.0"
description = "下班啦 · 桌面挂件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
png = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 老机器链接提速：dev / release 均不生成调试符号
[profile.dev]
debug = false

[profile.release]
debug = false
lto = true
