<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下班啦 · 桌面挂件演示</title>
<style>
  :root {
    --flesh: #FF5D73;
    --flesh-light: #FFD0D8;
    --rind-dark: #1F8A5B;
    --rind-light: #7BD389;
    --seed: #232323;
    --cream: #FFF9F2;
    --dog-body: #F7E6C9;
    --dog-ear: #C08A54;
    --text: #2B2B2B;
    --text-dim: #9A938B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #EFEBE3;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 16px 60px;
    color: var(--text);
  }
  .stage-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }

  /* ============ 挂件本体（模拟未来常驻桌面的半透明小窗） ============ */
  .widget {
    width: 340px;
    background: rgba(255, 252, 246, .92);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(35,35,35,.18), 0 0 0 1px rgba(255,255,255,.6) inset;
    padding: 16px 18px 18px;
    position: relative;
    overflow: hidden;
  }

  /* 顶部：气泡（全宽）+ 小狗（居中） */
  .pet-row { display: flex; flex-direction: column; gap: 2px; }
  .bubble {
    background: #fff;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 8px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    box-shadow: 0 3px 10px rgba(35,35,35,.08);
    min-height: 38px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    transition: opacity .3s;
    position: relative; z-index: 5;
  }
  .bubble.fade { opacity: 0; }

  /* ============ 小狗动画系统（多形态多动作） ============ */
  .dog { width: 150px; height: 141px; overflow: visible; align-self: center; cursor: pointer; }
  .dog * { transform-box: fill-box; }

  /* 常驻微动作 */
  .tail { transform-origin: 0% 50%; animation: wag .65s ease-in-out infinite alternate; transition: transform .35s; }
  @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(16deg); } }
  .breath { transform-origin: 50% 90%; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,.985); } }
  .eye { transform-origin: 50% 50%; animation: blink 4s infinite; }
  @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .gaze { transition: transform .35s; }
  .head { transform-origin: 50% 85%; animation: tilt 9s ease-in-out infinite; }
  @keyframes tilt { 0%,78%,100% { transform: rotate(0deg); } 84% { transform: rotate(-7deg); } 92% { transform: rotate(5deg); } }
  .ear-l { transform-origin: 80% 20%; animation: earL 9s ease-in-out infinite; transition: transform .35s; }
  .ear-r { transform-origin: 20% 20%; animation: earR 9s ease-in-out infinite; transition: transform .35s; }
  @keyframes earL { 0%,78%,100% { transform: rotate(0); } 84% { transform: rotate(-12deg); } 92% { transform: rotate(6deg); } }
  @keyframes earR { 0%,78%,100% { transform: rotate(0); } 84% { transform: rotate(-8deg); } 92% { transform: rotate(10deg); } }
  .tongue { opacity: 0; transition: opacity .3s; }
  .zzz, .heart, .crumb, .sweat, .snooze, .scold-mark { opacity: 0; }
  .paw-l, .paw-r { transition: opacity .25s; }

  /* 形态与道具切换 */
  .prop { opacity: 0; transition: opacity .3s; }
  .dog-sit { transition: opacity .3s; }
  .dog-lie, .dog-stand, .dog-toilet { opacity: 0; transition: opacity .3s; }
  .widget[data-act="present"] .dog-sit,
  .widget[data-act="toilet"] .dog-sit,
  .widget[data-act="sleep"] .dog-sit { opacity: 0; }
  .widget[data-act="present"] .dog-stand,
  .widget[data-act="toilet"] .dog-toilet,
  .widget[data-act="sleep"] .dog-lie { opacity: 1; }

  /* 搬砖 · 敲键盘 / 加班共用笔记本 */
  .widget[data-act="typing"] .prop-laptop,
  .widget[data-act="overtime"] .prop-laptop { opacity: 1; }
  .widget[data-act="typing"] .paw-l { animation: tapL .34s ease-in-out infinite alternate; }
  .widget[data-act="typing"] .paw-r { animation: tapR .34s ease-in-out infinite alternate .17s; }
  .widget[data-act="overtime"] .paw-l { animation: tapL .95s ease-in-out infinite alternate; }
  .widget[data-act="overtime"] .paw-r { animation: tapR .95s ease-in-out infinite alternate .45s; }
  @keyframes tapL { from { transform: translate(4px,-15px); } to { transform: translate(4px,-18px); } }
  @keyframes tapR { from { transform: translate(-4px,-15px); } to { transform: translate(-4px,-18px); } }
  .widget[data-act="typing"] .gaze, .widget[data-act="overtime"] .gaze { transform: translateY(2.2px); }
  .widget[data-act="typing"] .head { animation: typeHead 4.5s ease-in-out infinite; }
  @keyframes typeHead { 0%,100% { transform: rotate(2deg) translateY(1.5px); } 50% { transform: rotate(2.5deg) translateY(2.5px); } }

  /* 搬砖 · 做汇报 */
  .pointer-arm { transform-origin: 0% 100%; }
  .widget[data-act="present"] .pointer-arm { animation: pointTap 2.8s ease-in-out infinite; }
  @keyframes pointTap { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-6deg); } 45% { transform: rotate(0); } 60% { transform: rotate(-6deg); } 75% { transform: rotate(0); } }
  .widget[data-act="present"] .head-s { transform-origin: 50% 85%; animation: presentBob 2.8s ease-in-out infinite; }
  @keyframes presentBob { 0%,100% { transform: rotate(0); } 40% { transform: rotate(2.5deg); } }
  .widget[data-act="present"] .jaw,
  .widget[data-act="phone"] .jaw { transform-origin: 50% 0%; animation: talk .42s ease-in-out infinite; }
  @keyframes talk { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.8); } }

  /* 搬砖 · 挨骂 */
  .widget[data-act="scolded"] .head { animation: bowHead 3.6s ease-in-out infinite; }
  @keyframes bowHead {
    0%,60%,100% { transform: rotate(9deg) translateY(4px); }
    66% { transform: rotate(12deg) translateY(6.5px); }
    72% { transform: rotate(9deg) translateY(4px); }
    78% { transform: rotate(12deg) translateY(6px); }
    84% { transform: rotate(9deg) translateY(4px); }
  }
  .widget[data-act="scolded"] .ear-l { animation: none; transform: rotate(22deg); }
  .widget[data-act="scolded"] .ear-r { animation: none; transform: rotate(-22deg); }
  .widget[data-act="scolded"] .tail { animation: none; transform: rotate(-40deg); }
  .widget[data-act="scolded"] .gaze { transform: translateY(3px); }
  .widget[data-act="scolded"] .dog-sit { animation: tremble 3.6s ease-in-out infinite; }
  @keyframes tremble { 0%,7%,15%,100% { transform: translateX(0); } 9% { transform: translateX(-1.3px); } 11% { transform: translateX(1.3px); } 13% { transform: translateX(-.6px); } }
  .widget[data-act="scolded"] .scold-mark { opacity: 1; transform-origin: 50% 50%; animation: markPop 3.6s ease-out infinite; }
  @keyframes markPop { 0%,7%,16%,100% { transform: scale(0); opacity: 0; } 9% { transform: scale(1.3); opacity: 1; } 14% { transform: scale(1); opacity: 1; } }
  .widget[data-act="scolded"] .sweat,
  .widget[data-act="overtime"] .sweat { opacity: 1; animation: sweatDrop 1.8s ease-in infinite; }
  .widget[data-act="scolded"] .sweat.s2,
  .widget[data-act="overtime"] .sweat.s2 { animation-delay: .9s; }
  @keyframes sweatDrop { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(20px); opacity: 0; } }

  /* 搬砖 · 打瞌睡 */
  .widget[data-act="dozing"] .eye { animation: none; transform: scaleY(.3); }
  .widget[data-act="dozing"] .head { animation: nodOff 5s ease-in-out infinite; }
  @keyframes nodOff { 0%,70%,100% { transform: rotate(0) translateY(0); } 80% { transform: rotate(2deg) translateY(4px); } 90% { transform: rotate(0) translateY(0); } }
  .widget[data-act="dozing"] .snooze { opacity: 1; animation: zfloat2 2.4s ease-in-out infinite; }
  @keyframes zfloat2 { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px,-22px) scale(1.05); opacity: 0; } }
  .widget[data-act="dozing"] .tail { animation-duration: 1.6s; }

  /* 搬砖 · 打电话 */
  .widget[data-act="phone"] .prop-phone { opacity: 1; }
  .widget[data-act="phone"] .paw-r { opacity: 0; }
  .widget[data-act="phone"] .head { animation: phoneTalk 4s ease-in-out infinite; }
  @keyframes phoneTalk {
    0%,100% { transform: rotate(7deg) translateY(0); }
    20% { transform: rotate(7deg) translateY(2px); }
    40% { transform: rotate(7deg) translateY(0); }
    60% { transform: rotate(7deg) translateY(2px); }
    80% { transform: rotate(7deg) translateY(0); }
  }
  .widget[data-act="phone"] .ear-r { animation: none; transform: rotate(-16deg); }
  .widget[data-act="phone"] .gaze { transform: translateY(-1px); }

  /* 摸鱼 · 狗爪拿瓜 */
  .prop-melon { transform-origin: 50% 50%; transition: opacity .3s, transform .5s cubic-bezier(.34,1.56,.64,1); }
  .widget[data-act="melon"] .prop-melon { opacity: 1; transform: translate(26px,-34px) rotate(-18deg); }
  .widget[data-act="melon"] .paw-l, .widget[data-act="melon"] .paw-r { opacity: 0; }
  .widget[data-act="melon"] .head { animation: nom .55s ease-in-out infinite; }
  @keyframes nom { 0%,100% { transform: rotate(3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(2.5px); } }
  .widget[data-act="melon"] .jaw { transform-origin: 50% 0%; animation: chew .55s ease-in-out infinite; }
  @keyframes chew { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.9); } }
  .widget[data-act="melon"] .tongue { opacity: 1; }
  .widget[data-act="melon"] .tail { animation-duration: .32s; }
  .widget[data-act="melon"] .ear-l, .widget[data-act="melon"] .ear-r { animation: none; }
  .widget[data-act="melon"] .gaze { transform: translateY(-1.5px); }
  .widget[data-act="melon"] .crumb { opacity: 1; animation: drop 1.1s ease-in infinite; }
  .widget[data-act="melon"] .crumb.c2 { animation-delay: .55s; }
  @keyframes drop { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }

  /* 摸鱼 · 蹲坑刷手机 */
  .widget[data-act="toilet"] .thumb { animation: swipe 2.4s ease-in-out infinite; }
  @keyframes swipe { 0%,60%,100% { transform: translateY(0); } 72% { transform: translateY(-7px); } 84% { transform: translateY(-7px); } }
  .widget[data-act="toilet"] .leg-l { transform-origin: 50% 0%; animation: swingL 1.2s ease-in-out infinite alternate; }
  .widget[data-act="toilet"] .leg-r { transform-origin: 50% 0%; animation: swingR 1.2s ease-in-out infinite alternate; }
  @keyframes swingL { from { transform: rotate(5deg); } to { transform: rotate(-5deg); } }
  @keyframes swingR { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .widget[data-act="toilet"] .glow { opacity: .16; transition: opacity .5s; }
  .widget[data-act="toilet"] .head-t { transform-origin: 50% 85%; animation: chuckle 4.2s ease-in-out infinite; }
  @keyframes chuckle { 0%,82%,100% { transform: translateY(0); } 86% { transform: translateY(1.6px); } 90% { transform: translateY(0); } 94% { transform: translateY(1.6px); } }
  .gaze-t { transform: translateY(3px); }

  /* 加班硬撑 */
  .widget[data-act="overtime"] .head { animation: nodOff 5s ease-in-out infinite; }
  .widget[data-act="overtime"] .eye { animation: doze 5s infinite; }
  @keyframes doze { 0%,70%,100% { transform: scaleY(1); } 78%,86% { transform: scaleY(.25); } }
  .widget[data-act="overtime"] .tail { animation-duration: 1.4s; }

  /* 下班撒欢 */
  .widget[data-act="happy"] .breath { animation: hop .55s cubic-bezier(.36,0,.64,1) infinite; }
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1,1); }
    30% { transform: translateY(-14px) scale(.98,1.03); }
    55% { transform: translateY(0) scale(1.04,.94); }
    70% { transform: translateY(-4px) scale(1,1); }
  }
  .widget[data-act="happy"] .tail { animation-duration: .22s; }
  .widget[data-act="happy"] .tongue { opacity: 1; }
  .widget[data-act="happy"] .head { animation: shake .55s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .widget[data-act="happy"] .ear-l { transform-origin: 80% 20%; animation: flapL .55s ease-in-out infinite; }
  .widget[data-act="happy"] .ear-r { transform-origin: 20% 20%; animation: flapR .55s ease-in-out infinite; }
  @keyframes flapL { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
  @keyframes flapR { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-10deg); } }
  .widget[data-act="happy"] .heart { opacity: 1; animation: floatUp 1.6s ease-out infinite; }
  .widget[data-act="happy"] .heart.h2 { animation-delay: .55s; }
  .widget[data-act="happy"] .heart.h3 { animation-delay: 1.1s; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-46px) scale(1); opacity: 0; } }

  /* 周末趴睡 */
  .widget[data-act="sleep"] .zzz { opacity: 1; animation: zfloat 2.2s ease-in-out infinite; }
  .widget[data-act="sleep"] .zzz.z2 { animation-delay: .7s; font-size: 15px; }
  .widget[data-act="sleep"] .zzz.z3 { animation-delay: 1.4s; font-size: 19px; }
  @keyframes zfloat { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(14px,-30px) scale(1.15); opacity: 0; } }
  .widget[data-act="sleep"] .breath-lie { transform-origin: 50% 100%; animation: sleepBreathe 3.4s ease-in-out infinite; }
  @keyframes sleepBreathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.035,.96); } }
  .widget[data-act="sleep"] .tail-lie { transform-origin: 0% 50%; animation: wag 3s ease-in-out infinite alternate; }

  /* 中部：倒计时 */
  .count-row { text-align: center; margin-top: 2px; }
  .status-chip {
    display: inline-block; font-size: 11px; font-weight: 700;
    padding: 3px 12px; border-radius: 999px;
    background: #FFF0F2; color: var(--flesh); margin-bottom: 4px;
  }
  .status-chip.green { background: #E9F7EE; color: var(--rind-dark); }
  .big-time {
    font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .big-time .ms { font-size: 18px; color: var(--text-dim); }
  .big-text { font-size: 24px; font-weight: 800; }
  .count-label { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  /* 迷你西瓜进度条 */
  .bar {
    height: 14px; border-radius: 999px; margin-top: 10px;
    background: linear-gradient(#E5F3E9, #DDF0E3);
    border: 2px solid var(--rind-dark);
    position: relative; overflow: hidden;
  }
  .bar .fill {
    position: absolute; inset: 0; width: 0%;
    background: linear-gradient(90deg, #FF8A9A, var(--flesh));
    border-radius: 999px;
    transition: width .3s linear;
  }
  .bar .moyu-seg { position: absolute; top: 0; bottom: 0; background: var(--flesh-light); }
  .weekend-line { text-align: center; font-size: 12.5px; margin-top: 8px; color: var(--text); }
  .weekend-line b { color: var(--flesh); }

  /* 钱 */
  .money-row { display: flex; gap: 8px; margin-top: 12px; }
  .money-card {
    flex: 1; border-radius: 16px; padding: 8px 10px; text-align: center;
    background: #F2FBF4; border: 1px solid #D8EFDD;
  }
  .money-card.loss { background: #FFF3F4; border-color: #FBDDE1; }
  .money-card .t { font-size: 10.5px; color: var(--text-dim); }
  .money-card .v {
    font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--rind-dark); margin-top: 1px;
  }
  .money-card.loss .v { color: var(--flesh); }
  .money-card.hidden { display: none; }

  /* 主按钮：唯一的交互 */
  .main-btn {
    width: 100%; margin-top: 12px; border: none; border-radius: 18px;
    padding: 13px; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; color: #fff; background: var(--rind-dark);
    box-shadow: 0 6px 18px rgba(31,138,91,.35);
    transition: transform .12s;
  }
  .main-btn:active { transform: scale(.97); }
  .main-btn.moyu-ing { background: var(--flesh); box-shadow: 0 6px 18px rgba(255,93,115,.35); }

  /* 底部工具行 */
  .tool-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .tool-row .todo-hint { font-size: 11.5px; color: var(--text-dim); }
  .tool-row .todo-hint b { color: var(--flesh); }
  .icon-btn {
    border: none; background: #F4F0EA; border-radius: 10px;
    width: 30px; height: 30px; cursor: pointer; font-size: 14px; color: var(--text-dim);
  }

  /* 抽屉（设置 / 待办） */
  .drawer { display: none; margin-top: 12px; border-top: 1px dashed #EDE7DE; padding-top: 12px; }
  .drawer.open { display: block; }
  .drawer h3 { font-size: 13px; margin-bottom: 8px; }
  .field label { font-size: 11.5px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .drawer input[type=time], .drawer input[type=number] {
    width: 100%; border: 1.5px solid #EDE7DE; border-radius: 10px; padding: 7px 9px;
    font-size: 13px; font-family: inherit; background: var(--cream);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .wd-row { display: flex; gap: 4px; margin-bottom: 10px; }
  .wd-btn {
    flex: 1; border: 1.5px solid #EDE7DE; background: var(--cream); border-radius: 8px;
    padding: 6px 0; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text-dim);
  }
  .wd-btn.on { background: var(--rind-dark); border-color: var(--rind-dark); color: #fff; }
  .seg-row { display: flex; gap: 4px; }
  .seg-btn {
    flex: 1; border: 1.5px solid #EDE7DE; background: var(--cream); border-radius: 8px;
    padding: 6px 0; font-size: 11px; cursor: pointer; font-family: inherit; color: var(--text-dim);
  }
  .seg-btn.on { background: var(--flesh); border-color: var(--flesh); color: #fff; font-weight: 700; }
  .ov-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-btn {
    border: 1.5px solid #EDE7DE; background: var(--cream); border-radius: 999px;
    padding: 5px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .chip-btn.on { background: var(--seed); color: #fff; border-color: var(--seed); }
  ul.todo-list { list-style: none; }
  ul.todo-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; border-bottom: 1px solid #F4EFE8; }
  ul.todo-list li:last-child { border-bottom: none; }
  ul.todo-list li.done .t { text-decoration: line-through; color: var(--text-dim); }
  ul.todo-list input[type=checkbox] { accent-color: var(--rind-dark); }
  ul.todo-list .t { flex: 1; }
  ul.todo-list .del { border: none; background: none; color: var(--text-dim); cursor: pointer; }
  .todo-add { display: flex; gap: 6px; margin-bottom: 6px; }
  .todo-add input { flex: 1; border: 1.5px solid #EDE7DE; border-radius: 10px; padding: 7px 9px; font-size: 12.5px; font-family: inherit; background: var(--cream); }
  .todo-add button { border: none; border-radius: 10px; background: var(--rind-dark); color: #fff; padding: 0 12px; cursor: pointer; font-family: inherit; }

  /* 演示时间机 */
  .demo-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
  .demo-note { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 6px; }

  /* ============ 首次引导遮罩 ============ */
  .onboarding {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(35,35,35,.45); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .onboarding.show { display: flex; }
  .ob-card {
    width: 360px; background: var(--cream); border-radius: 24px; padding: 26px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .ob-card h2 { font-size: 19px; margin-bottom: 4px; }
  .ob-card .ob-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 16px; }
  .ob-card .field { margin-bottom: 14px; }
  .ob-card input[type=number], .ob-card input[type=time] {
    width: 100%; border: 1.5px solid #EDE7DE; border-radius: 12px; padding: 10px 12px;
    font-size: 15px; font-family: inherit; background: #fff;
  }
  .ob-actions { display: flex; gap: 10px; margin-top: 18px; }
  .ob-actions .main-btn { margin-top: 0; }
  .ob-skip { flex: 0 0 auto; border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; font-family: inherit; padding: 0 6px; }
</style>
</head>

<div class="stage-hint">↓ 这就是未来常驻桌面的挂件形态（340px 小窗演示）</div>

<script>
"use strict";

/* ============ 状态 ============ */
const LS_KEY = "watermelon-widget-v1";
const defaultState = () => ({
  onboarded: false,
  schedule: { workdays: [2,3,4,5,6], startH: 9, startM: 0, endH: 18, endM: 0 },
  salary: 0,          // 月薪，0 = 未录入
  otRate: 0,          // 加班费倍率，0 = 没有加班费
  overrides: {},      // dayKey -> { type, minutes? }
  todos: [],
  moyuSessions: []
});
function load() {
  try { return Object.assign(defaultState(), JSON.parse(localStorage.getItem(LS_KEY)) || {}); }
  catch { return defaultState(); }
}
let S = load();
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(S));

/* ============ 演示时钟 ============ */
let sim = null;
const now = () => sim ? new Date(sim.base + (Date.now() - sim.setAt)) : new Date();
const DAY_MS = 86400000;
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtHM = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
function fmtHMSms(ms) {
  const t = Math.max(0, ms);
  const p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(t/3600000))}:${p(Math.floor(t/60000)%60)}:${p(Math.floor(t/1000)%60)}`;
}

/* ============ 引擎（同 Swift 核心逻辑） ============ */
function resolveDay(day) {
  const ov = S.overrides[dayKey(day)];
  if (ov && (ov.type === "holiday" || ov.type === "leave")) return { work: false, reason: ov.type };
  if (!S.schedule.workdays.includes(day.getDay() + 1)) return { work: false, reason: "weekend" };
  const start = new Date(startOfDay(day)); start.setHours(S.schedule.startH, S.schedule.startM, 0, 0);
  let end = new Date(startOfDay(day)); end.setHours(S.schedule.endH, S.schedule.endM, 0, 0);
  const normalEnd = new Date(end);
  if (ov && ov.type === "overtime") end = new Date(end.getTime() + ov.minutes * 60000);
  const limit = new Date(startOfDay(day).getTime() + DAY_MS - 1000);
  if (end > limit) end = limit;
  if (end <= start) return { work: false, reason: "weekend" };
  return { work: true, start, end, normalEnd, overtimeMin: ov && ov.type === "overtime" ? ov.minutes : 0 };
}
function statusAt(t) {
  const r = resolveDay(t);
  if (!r.work) return { type: "rest", reason: r.reason };
  if (t < r.start) return { type: "beforeWork", start: r.start, end: r.end };
  if (t < r.end) return { type: "working", ...r, remaining: r.end - t, progress: (t - r.start) / (r.end - r.start) };
  return { type: "offWork", day: r };
}
function weekendCountdown(t) {
  const mon0 = (t.getDay() + 6) % 7;
  for (let w = 0; w < 4; w++) {
    const ws = new Date(startOfDay(t).getTime() + (w * 7 - mon0) * DAY_MS);
    let lastEnd = null;
    for (let i = 0; i < 7; i++) {
      const r = resolveDay(new Date(ws.getTime() + i * DAY_MS));
      if (r.work) lastEnd = r.end;
    }
    if (lastEnd && lastEnd > t) return lastEnd - t;
  }
  return null;
}
function moyuMs(t) {
  const ds = startOfDay(t).getTime(), de = ds + DAY_MS;
  let total = 0, active = false;
  for (const s of S.moyuSessions) {
    const end = s.end == null ? t.getTime() : s.end;
    const a = Math.max(s.start, ds), b = Math.min(end, de);
    if (b > a) total += b - a;
    if (s.end == null) active = true;
  }
  return { ms: total, active };
}

/* ============ 钱 ============ */
// 时薪 = 月薪 / 21.75 计薪日 / 每日工时
function perSecondWage() {
  const hours = (S.schedule.endH * 60 + S.schedule.endM - S.schedule.startH * 60 - S.schedule.startM) / 60;
  if (!S.salary || hours <= 0) return 0;
  return S.salary / 21.75 / hours / 3600;
}
const fmtMoney = v => "¥" + v.toFixed(4);

/* ============ 幽默文案 ============ */
const LINES = {
  working: ["砖烫手也得搬，瓜熟了才算完", "认真搬砖，西瓜会有的", "当前状态：假装很忙", "老板画的饼还在锅里", "每一秒都是钱，别浪费"],
  moyu: ["带薪摸鱼，血赚不亏", "这班是越上越有性价比", "放心摸，狗帮你盯着老板", "摸鱼不是摆烂，是行为艺术", "工资照发，快乐加倍"],
  offWork: ["下班不积极，思想有问题", "今日份的班就上到这了", "溜了溜了，瓜都等急了", "打卡走人，头也不回"],
  rest: ["今天不上班，瓜随便吃", "周末的空气都是甜的", "休息是为了更好地摸鱼"],
  beforeWork: ["还没上班，再赖五分钟", "早八人，打工魂", "新的一天，新的砖"],
  overtime: ["人在工位，魂在床位", "这班加得，狗都困了", "加班费结一下？（灵魂拷问）"],
};
/* ============ 桌宠动作调度 ============ */
const ACT_LINES = {
  typing: ["噼里啪啦一顿敲，其实在斗图", "键盘冒火星，产出为零", "这个需求很简单.jpg"],
  present: ["我简单讲两句（第 40 分钟）", "大家看这条曲线……它不乐观", "PPT 第 87 页，坚持住"],
  scolded: ["是是是，马上改（第 8 版）", "好的收到，问题都怪我", "耳朵已关闭，灵魂已下班"],
  dozing: ["我没睡，我在闭目思考", "眼皮：我先下班了", "zzz…啊！老板我在听！"],
  phone: ["喂您好，方案已发您邮箱（没发）", "好好好，都可以谈", "客户说要五彩斑斓的黑"],
  melon: ["吧唧吧唧…这瓜真甜", "摸鱼赚的钱，才是赚的钱", "帮我盯着点老板，汪"],
  toilet: ["厕所，打工人最后的净土", "带薪蹲坑，赚到", "刷完这条视频就回去…真的"],
};
const PET_ACTS = {
  working: ["typing", "present", "scolded", "dozing", "phone"],
  moyu: ["melon", "toilet"],
  overtime: ["overtime"],
  happy: ["happy"],
  rest: ["sleep"],
  beforeWork: ["dozing"],
};
let petMood = "", petAct = "", petTimer = 0;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function petLine() {
  if (petMood === "beforeWork") return pick(LINES.beforeWork);
  if (petMood === "rest") return pick(LINES.rest);
  if (petMood === "happy") return pick(LINES.offWork);
  if (petMood === "overtime") return pick(LINES.overtime);
  return pick(ACT_LINES[petAct] || LINES.working);
}
function rotateAct() {
  clearTimeout(petTimer);
  const list = PET_ACTS[petMood] || PET_ACTS.working;
  let next = pick(list), guard = 0;
  while (list.length > 1 && next === petAct && guard++ < 10) next = pick(list);
  petAct = next;
  $("widget").dataset.act = next;
  setBubble(petLine());
  petTimer = setTimeout(rotateAct, list.length > 1 ? 6500 + Math.random() * 3000 : 8000);
}
function petSetMood(mood) {
  if (mood === petMood) return;
  petMood = mood;
  rotateAct();
}

/* ============ 渲染 ============ */
const $ = id => document.getElementById(id);
function setBubble(text) {
  const b = $("bubble");
  b.classList.add("fade");
  setTimeout(() => { b.textContent = text; b.classList.remove("fade"); }, 250);
}

function render() {
  const t = now();
  const st = statusAt(t);
  const my = moyuMs(t);
  const wage = perSecondWage();

  // 状态与心情
  let mood = "working", chip = ["搬砖中", ""], label = "", big = "", showMs = false;
  if (st.type === "working") {
    big = fmtHMSms(st.remaining);
    label = `距离下班 · 今天 ${fmtHM(st.start)} – ${fmtHM(st.end)}${st.overtimeMin ? "（加班中）" : ""}`;
    mood = my.active ? "moyu" : (st.overtimeMin ? "overtime" : "working");
    chip = my.active ? ["摸鱼中", ""] : (st.overtimeMin ? ["加班中", ""] : ["搬砖中", ""]);
    $("barFill").style.width = (st.progress * 100) + "%";
    // 摸鱼区段
    const bm = $("barMoyu"); bm.innerHTML = "";
    for (const s of S.moyuSessions) {
      const a = Math.max(s.start, st.start.getTime());
      const b = Math.min(s.end == null ? t.getTime() : s.end, st.end.getTime());
      if (b > a) {
        const seg = document.createElement("div");
        seg.className = "moyu-seg";
        seg.style.left = ((a - st.start) / (st.end - st.start) * 100) + "%";
        seg.style.width = ((b - a) / (st.end - st.start) * 100) + "%";
        bm.appendChild(seg);
      }
    }
  } else if (st.type === "beforeWork") {
    big = fmtHMSms(st.start - t);
    label = "距离上班";
    chip = ["还没上班", "green"];
    mood = "beforeWork";
    $("barFill").style.width = "0%";
  } else if (st.type === "offWork") {
    big = "已经下班啦";
    label = "辛苦了，去享受生活吧";
    chip = ["已下班", "green"];
    mood = "happy";
    $("barFill").style.width = "100%";
  } else {
    big = { weekend: "今天休息", holiday: "放假中", leave: "请假中" }[st.reason];
    label = "不上班的日子，瓜都是甜的";
    chip = [{ weekend: "周末愉快", holiday: "今天放假", leave: "今天请假" }[st.reason], "green"];
    mood = "rest";
    $("barFill").style.width = "0%";
  }
  petSetMood(mood);
  $("statusChip").textContent = chip[0];
  $("statusChip").className = "status-chip " + chip[1];
  const bigEl = $("bigTime");
  bigEl.className = big.includes(":") ? "big-time" : "big-text";
  // 摸鱼中倒计时附带毫秒（用户要求精确到毫秒的是摸鱼计时）
  if (my.active) {
    bigEl.innerHTML = fmtHMSms(my.ms) + `<span class="ms">.${String(my.ms % 1000).padStart(3, "0")}</span>`;
    label = "本次带薪摸鱼时长";
  } else {
    bigEl.textContent = big;
  }
  $("countLabel").textContent = label;

  // 周末
  const wk = weekendCountdown(t);
  if (wk == null) $("weekendLine").textContent = "这周没有工作日啦";
  else {
    const d = Math.floor(wk / DAY_MS), h = Math.floor(wk % DAY_MS / 3600000), m = Math.floor(wk % 3600000 / 60000);
    $("weekendLine").innerHTML = `距离周末还有 <b>${d > 0 ? d + " 天 " : ""}${h} 小时 ${m} 分</b>`;
  }

  // 摸鱼进账
  if (wage > 0 && my.ms > 0) {
    $("moneyMoyu").classList.remove("hidden");
    $("moyuMoney").textContent = "+" + fmtMoney(my.ms / 1000 * wage);
  } else if (wage <= 0) {
    $("moneyMoyu").classList.remove("hidden");
    $("moyuMoney").textContent = "录月薪后开算";
  } else {
    $("moyuMoney").textContent = "+" + fmtMoney(0);
  }

  // 加班亏/赚
  const todayR = resolveDay(t);
  if (todayR.work && todayR.overtimeMin > 0 && wage > 0) {
    $("moneyOt").classList.remove("hidden");
    const secs = todayR.overtimeMin * 60;
    if (S.otRate > 0) {
      $("otTitle").textContent = "加班费回血";
      $("moneyOt").classList.remove("loss");
      $("otMoney").textContent = "+" + fmtMoney(secs * wage * S.otRate);
    } else {
      $("otTitle").textContent = "今日加班白给";
      $("moneyOt").classList.add("loss");
      $("otMoney").textContent = "-" + fmtMoney(secs * wage);
    }
  } else {
    $("moneyOt").classList.add("hidden");
  }

  // 主按钮
  const btn = $("mainBtn");
  btn.textContent = my.active ? "继续搬砖" : "开始摸鱼";
  btn.className = "main-btn" + (my.active ? " moyu-ing" : "");

  // 今日特殊
  const ov = S.overrides[dayKey(t)];
  $("overrideNote").textContent = ov ? `（${{overtime:"加班+2h",holiday:"放假",leave:"请假"}[ov.type]}）` : "";
}

/* ============ 交互 ============ */
function toggleMoyu() {
  const t = now();
  const active = S.moyuSessions.find(s => s.end == null);
  if (active) active.end = t.getTime();
  else S.moyuSessions.push({ start: t.getTime(), end: null });
  save(); render();
}
$("mainBtn").onclick = toggleMoyu;
$("dogSvg").onclick = toggleMoyu;   // 点小狗也能摸鱼

$("todoToggle").onclick = () => { $("todoDrawer").classList.toggle("open"); $("gearDrawer").classList.remove("open"); };
$("gearToggle").onclick = () => { $("gearDrawer").classList.toggle("open"); $("todoDrawer").classList.remove("open"); syncSettingsUI(); };

function renderTodos() {
  const ul = $("todoList"); ul.innerHTML = "";
  for (const item of S.todos) {
    const li = document.createElement("li");
    if (item.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = item.done;
    cb.onchange = () => { item.done = cb.checked; save(); renderTodos(); };
    const sp = document.createElement("span"); sp.className = "t"; sp.textContent = item.title;
    const del = document.createElement("button"); del.className = "del"; del.textContent = "✕";
    del.onclick = () => { S.todos = S.todos.filter(x => x.id !== item.id); save(); renderTodos(); };
    li.append(cb, sp, del); ul.appendChild(li);
  }
  $("todoLeft").textContent = S.todos.filter(x => !x.done).length;
}
$("todoAddBtn").onclick = () => {
  const v = $("todoInput").value.trim(); if (!v) return;
  S.todos.push({ id: Date.now(), title: v, done: false });
  $("todoInput").value = ""; save(); renderTodos();
};

/* ---- 设置 ---- */
const WD = [["一",2],["二",3],["三",4],["四",5],["五",6],["六",7],["日",1]];
function syncSettingsUI() {
  const row = $("wdRow"); row.innerHTML = "";
  WD.forEach(([label, code]) => {
    const b = document.createElement("button");
    b.className = "wd-btn" + (S.schedule.workdays.includes(code) ? " on" : "");
    b.textContent = label;
    b.onclick = () => {
      const i = S.schedule.workdays.indexOf(code);
      i >= 0 ? S.schedule.workdays.splice(i, 1) : S.schedule.workdays.push(code);
      b.classList.toggle("on"); save(); render();
    };
    row.appendChild(b);
  });
  $("startTime").value = `${String(S.schedule.startH).padStart(2,"0")}:${String(S.schedule.startM).padStart(2,"0")}`;
  $("endTime").value = `${String(S.schedule.endH).padStart(2,"0")}:${String(S.schedule.endM).padStart(2,"0")}`;
  $("salaryInput").value = S.salary || "";
  document.querySelectorAll("#otRateRow .seg-btn").forEach(b => {
    b.classList.toggle("on", Number(b.dataset.rate) === S.otRate);
    b.onclick = () => { S.otRate = Number(b.dataset.rate); save(); syncSettingsUI(); render(); };
  });
}
$("startTime").onchange = e => { const [h,m] = e.target.value.split(":").map(Number); S.schedule.startH=h; S.schedule.startM=m; save(); render(); };
$("endTime").onchange = e => { const [h,m] = e.target.value.split(":").map(Number); S.schedule.endH=h; S.schedule.endM=m; save(); render(); };
$("salaryInput").onchange = e => { S.salary = Math.max(0, Number(e.target.value) || 0); save(); render(); };

function setOv(v) { const k = dayKey(now()); v ? S.overrides[k] = v : delete S.overrides[k]; save(); render(); }
$("ovOvertime").onclick = () => setOv({ type: "overtime", minutes: 120 });
$("ovHoliday").onclick = () => setOv({ type: "holiday" });
$("ovLeave").onclick = () => setOv({ type: "leave" });
$("ovClear").onclick = () => setOv(null);

/* ---- 演示时间机 ---- */
function monday(base) { const d = startOfDay(base); return new Date(d.getTime() - ((base.getDay()+6)%7) * DAY_MS); }
const PRESETS = {
  "wed-noon": b => { const m = monday(b); m.setDate(m.getDate()+2); m.setHours(13,30,0,0); return m; },
  "fri-1700": b => { const m = monday(b); m.setDate(m.getDate()+4); m.setHours(17,0,0,0); return m; },
  "sat-noon": b => { const m = monday(b); m.setDate(m.getDate()+5); m.setHours(11,0,0,0); return m; },
};
document.querySelectorAll("[data-sim]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("[data-sim]").forEach(x => x.classList.remove("on"));
    if (btn.dataset.sim === "real") sim = null;
    else { btn.classList.add("on"); const d = PRESETS[btn.dataset.sim](new Date()); sim = { base: d.getTime(), setAt: Date.now() }; }
    render();
  };
});

/* ============ 首次引导 ============ */
const OB_STEPS = [
  () => `
    <h2>先说好你几点上下班</h2>
    <div class="ob-sub">狗要掐着点替你盼下班</div>
    <div class="field"><label>上班时间</label><input type="time" id="obStart" value="09:00"></div>
    <div class="field"><label>下班时间</label><input type="time" id="obEnd" value="18:00"></div>
    <div class="ob-actions"><button class="main-btn" id="obNext">下一步</button></div>`,
  () => `
    <h2>月薪多少？</h2>
    <div class="ob-sub">放心，狗嘴很严。录了它，摸鱼的每一毫秒都给你折算成钱</div>
    <div class="field"><label>月薪（元）</label><input type="number" id="obSalary" placeholder="例如 15000" min="0" step="500"></div>
    <div class="ob-actions">
      <button class="ob-skip" id="obSkip">先不录</button>
      <button class="main-btn" id="obNext">下一步</button>
    </div>`,
  () => `
    <h2>加班有加班费吗？</h2>
    <div class="ob-sub">没有的话，加班时长按「白给」算；有就按倍率算「回血」</div>
    <div class="seg-row" style="margin-top:4px" id="obRateRow">
      <button class="seg-btn on" data-rate="0">没有（落泪）</button>
      <button class="seg-btn" data-rate="1.5">1.5×</button>
      <button class="seg-btn" data-rate="2">2×</button>
      <button class="seg-btn" data-rate="3">3×</button>
    </div>
    <div class="ob-actions"><button class="main-btn" id="obDone">开整！</button></div>`,
];
let obStep = 0, obRate = 0;
function showOb() {
  const card = $("obCard");
  card.innerHTML = OB_STEPS[obStep]();
  $("onboarding").classList.add("show");
  if (obStep === 2) {
    document.querySelectorAll("#obRateRow .seg-btn").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll("#obRateRow .seg-btn").forEach(x => x.classList.remove("on"));
        b.classList.add("on"); obRate = Number(b.dataset.rate);
      };
    });
    $("obDone").onclick = () => {
      S.otRate = obRate; S.onboarded = true; save();
      $("onboarding").classList.remove("show"); render();
    };
    return;
  }
  $("obNext").onclick = () => {
    if (obStep === 0) {
      const [sh, sm] = $("obStart").value.split(":").map(Number);
      const [eh, em] = $("obEnd").value.split(":").map(Number);
      S.schedule.startH = sh; S.schedule.startM = sm; S.schedule.endH = eh; S.schedule.endM = em;
    } else if (obStep === 1) {
      S.salary = Math.max(0, Number($("obSalary").value) || 0);
    }
    save(); obStep++; showOb();
  };
  const skip = $("obSkip");
  if (skip) skip.onclick = () => { save(); obStep++; showOb(); };
}

/* ============ 启动 ============ */
renderTodos();
render();
setInterval(render, 47); // 47ms 刷新，毫秒位平滑跳动
if (!S.onboarded) showOb();
</script>
</body>
