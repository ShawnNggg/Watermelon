name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App (conf targets = dmg + app)
        working-directory: widget
        run: |
          npm ci
          npm run tauri build
        shell: bash

      - name: Upload ALL bundle files as Artifact (see real paths)
        uses: actions/upload-artifact@v4
        with:
          name: full-bundle
          path: widget/src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Upload only updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-files
          path: |
            widget/src-tauri/target/release/bundle/**/*.dmg
            widget/src-tauri/target/release/bundle/**/*.app.tar.gz
            widget/src-tauri/target/release/bundle/**/*.sig
            widget/src-tauri/target/release/bundle/**/latest*.json
          if-no-files-found: warn

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # 直接 glob bundle 目录所有产物（DMG + .app.tar.gz + .sig + latest.json）
          files: |
            widget/src-tauri/target/release/bundle/**/*.dmg
            widget/src-tauri/target/release/bundle/**/*.app.tar.gz
            widget/src-tauri/target/release/bundle/**/*.sig
            widget/src-tauri/target/release/bundle/**/latest*.json
