name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App
        working-directory: widget
        run: |
          npm ci
          npm run tauri build -- --bundles dmg
        shell: bash

      - name: List ALL bundle artifacts
        run: |
          echo "=== bundle dir ==="
          find widget/src-tauri/target/release/bundle -type f | sort

      - name: Collect artifacts for Release
        run: |
          mkdir -p ./release
          cd widget/src-tauri/target/release/bundle

          # DMG
          find . -name "*.dmg" -exec cp -v {} ../../../release/ \;
          # macOS updater: .app.tar.gz + .sig
          find . -name "*.app.tar.gz" -exec cp -v {} ../../../release/ \;
          find . -name "*.app.tar.gz.sig" -exec cp -v {} ../../../release/ \;
          # latest.json
          find . -name "latest*.json" -exec cp -v {} ../../../release/ \;

          echo ""
          echo "=== release/ final ==="
          ls -lh ../../../release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
