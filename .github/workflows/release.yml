name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App (conf targets = dmg + app)
        working-directory: widget
        run: |
          npm ci
          npm run tauri build
        shell: bash

      - name: Copy ALL artifacts to ./release (simple bash, no find)
        run: |
          mkdir -p release
          BUNDLE="widget/src-tauri/target/release/bundle"
          echo "=== Locating files in bundle ==="
          find "$BUNDLE" -maxdepth 4 -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" -o -name "latest*.json" \) 2>/dev/null | tee /tmp/all_files.txt
          echo ""
          echo "=== Copying to release/ ==="
          while IFS= read -r f; do
            if [ -n "$f" ]; then
              cp -v "$f" release/ 2>/dev/null || cp -v "$f" release/$(basename "$f")
            fi
          done < /tmp/all_files.txt
          echo ""
          echo "=== release/ final ==="
          ls -lh release/

      - name: Upload release/ as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-release-files
          path: release/
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release/*
