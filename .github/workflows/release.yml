name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App
        working-directory: widget
        run: |
          npm ci
          npm run tauri build -- --bundles dmg
        shell: bash

      - name: DEBUG — List ALL target artifacts
        run: |
          echo "=== target/release/bundle tree ==="
          find widget/src-tauri/target/release/bundle -type f 2>/dev/null | sort
          echo ""
          echo "=== all archive/json files under target ==="
          find widget/src-tauri/target -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" -o -name "latest*.json" -o -name "*.json" \) 2>/dev/null | sort

      - name: Upload bundle as Artifact (for debug)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-output
          path: widget/src-tauri/target/release/bundle/
          if-no-files-found: warn
        continue-on-error: true

      - name: Collect artifacts into ./release (best-effort)
        run: |
          set +e
          mkdir -p ./release
          cd widget/src-tauri/target/release/bundle

          echo "=== Copying DMG ==="
          find . -name "*.dmg" -exec cp -v {} ../../../release/ \;
          echo "=== Copying .app.tar.gz ==="
          find . -name "*.app.tar.gz" -exec cp -v {} ../../../release/ \;
          echo "=== Copying .sig ==="
          find . -name "*.app.tar.gz.sig" -exec cp -v {} ../../../release/ \;
          echo "=== Copying latest*.json ==="
          find . -name "latest*.json" -exec cp -v {} ../../../release/ \;

          echo ""
          echo "=== release/ final content ==="
          ls -lh ../../../release/ 2>/dev/null
          echo "=== done ==="
        shell: bash
        continue-on-error: true

      - name: Upload collected artifacts as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-release-files
          path: release/
          if-no-files-found: warn
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        if: ${{ always() }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/*
