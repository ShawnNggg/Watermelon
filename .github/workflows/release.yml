name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App
        working-directory: widget
        run: |
          npm ci
          npm run tauri build
        shell: bash

      - name: Collect artifacts + generate latest.json
        run: |
          set +e
          mkdir -p release
          BUNDLE="widget/src-tauri/target/release/bundle"
          TAG="${GITHUB_REF_NAME}"
          REPO="ShawnNggg/-"

          echo "=== Copying files to ./release/ ==="
          # DMG
          find "$BUNDLE" -name "*.dmg" -type f | while IFS= read -r src; do cp -v "$src" "release/"; done
          # .app.tar.gz (updater)
          find "$BUNDLE" -name "*.app.tar.gz" -type f | while IFS= read -r src; do cp -v "$src" "release/"; done
          # .sig
          find "$BUNDLE" -name "*.app.tar.gz.sig" -type f | while IFS= read -r src; do cp -v "$src" "release/"; done

          echo ""
          echo "=== release/ contents ==="
          ls -lh release/

          echo ""
          echo "=== Generating latest.json ==="

          # 1. 读 version
          VERSION=$(python3 -c "import json; print(json.load(open('widget/src-tauri/tauri.conf.json'))['version'])")
          echo "Version: $VERSION"

          # 2. 读 .sig 文件内容
          SIG_FILE=$(find "$BUNDLE" -name "*.app.tar.gz.sig" -type f | head -1)
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE")
            echo "Signature found ($(echo "$SIGNATURE" | wc -c | tr -d ' ') bytes)"
          else
            echo "❌ NO SIG FILE FOUND!"
            SIGNATURE=""
          fi

          # 3. 确定 tar.gz 文件名
          TARGZ_FILE=$(find "$BUNDLE" -name "*.app.tar.gz" -type f | head -1)
          TARGZ_BASENAME=$(basename "$TARGZ_FILE")
          echo "tar.gz basename: $TARGZ_BASENAME"

          # 4. 构造下载 URL
          TARGZ_URL="https://github.com/${REPO}/releases/download/${TAG}/${TARGZ_BASENAME}"
          echo "tar.gz URL: $TARGZ_URL"

          # 5. 写 latest.json
          python3 << PYEOF
import json, datetime, os

version = "$VERSION"
sig = """$SIGNATURE"""
url = "$TARGZ_URL"
now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

manifest = {
    "version": version,
    "notes": f"Watermelon v{version} 自动构建",
    "pub_date": now,
    "platforms": {
        "darwin-aarch64": {
            "signature": sig.strip(),
            "url": url
        }
    }
}

with open("release/latest.json", "w") as f:
    json.dump(manifest, f, indent=2)

print("✅ Written release/latest.json")
print(json.dumps(manifest, indent=2))
PYEOF

          echo ""
          echo "=== final release/ ==="
          ls -lh release/
          cat release/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release/*
