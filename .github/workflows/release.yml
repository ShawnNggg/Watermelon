name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App
        working-directory: widget
        run: |
          npm ci
          npm run tauri build
        shell: bash

      - name: Collect artifacts + generate latest.json
        working-directory: .
        run: |
          mkdir -p release
          BUNDLE="widget/src-tauri/target/release/bundle"

          echo "=== Copying to ./release/ ==="
          find "$BUNDLE" -name "*.dmg" -type f | while IFS= read -r s; do cp -v "$s" release/; done
          find "$BUNDLE" -name "*.app.tar.gz" -type f | while IFS= read -r s; do cp -v "$s" release/; done
          find "$BUNDLE" -name "*.app.tar.gz.sig" -type f | while IFS= read -r s; do cp -v "$s" release/; done

          echo ""
          echo "=== release/ after copy ==="
          ls -lh release/

          echo ""
          echo "=== Generating latest.json via gen-latest.py ==="
          VERSION=$(python3 -c "import json; print(json.load(open('widget/src-tauri/tauri.conf.json'))['version'])")
          python3 scripts/gen-latest.py "$VERSION" "${GITHUB_REF_NAME}" "ShawnNggg/-"

          echo ""
          echo "=== final release/ ==="
          ls -lh release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release/*
