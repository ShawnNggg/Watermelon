name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App
        working-directory: widget
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundle }} --target ${{ matrix.target }}
        shell: bash

      - name: List ALL bundle artifacts (DEBUG)
        run: |
          echo "=== bundle dir tree ==="
          find widget/src-tauri/target/release/bundle -type f 2>/dev/null | sort
          echo ""
          echo "=== ALL files under target/release ==="
          find widget/src-tauri/target/release -maxdepth 5 -type f \
            \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" -o -name "*.json" -o -name "*.app" \) 2>/dev/null | sort

      - name: Collect updater artifacts into ./release
        run: |
          mkdir -p ./release
          cd widget/src-tauri/target/release/bundle

          # 复制所有 DMG
          find . -name "*.dmg" -exec cp -v {} ../../../release/ \;

          # 复制 macOS updater artifacts (.app.tar.gz + .sig) - 不管子目录
          find . -name "*.app.tar.gz" -exec cp -v {} ../../../release/ \;
          find . -name "*.app.tar.gz.sig" -exec cp -v {} ../../../release/ \;

          # 复制 latest.json - 不管子目录
          find . -name "latest*.json" -exec cp -v {} ../../../release/ \;

          echo ""
          echo "=== release/ 目录最终内容 ==="
          ls -lh ../../../release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
