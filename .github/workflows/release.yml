name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# ⚠️ 首次使用前必须在 GitHub repo Settings → Secrets 里添加：
#   TAURI_SIGNING_PRIVATE_KEY  → 本地私钥文件 ~/.tauri/watermelon.key 的完整内容
#   （不是 pubkey，也不是文件路径，是文件里的 base64 那一行）
# 私钥生成命令： npx tauri signer generate -w ~/.tauri/watermelon.key
# 生成后 cat ~/.tauri/watermelon.key 把内容粘到 GitHub Secret 里

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundle: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App
        working-directory: widget
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundle }}
        shell: bash

      - name: List artifacts
        run: find widget/src-tauri/target/release/bundle -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            widget/src-tauri/target/release/bundle/dmg/*.dmg
            widget/src-tauri/target/release/bundle/macos/*.app.tar.gz
            widget/src-tauri/target/release/bundle/**/latest*.json
            widget/src-tauri/target/release/bundle/**/*.tar.gz.sig
