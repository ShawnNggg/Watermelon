name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PATH: "/tmp/tauri-private.key"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write signing key to file
        run: echo "$TAURI_SIGNING_PRIVATE_KEY" > "$TAURI_SIGNING_PRIVATE_KEY_PATH"
        shell: bash

      - name: Build Tauri App (conf targets = dmg + app)
        working-directory: widget
        run: |
          npm ci
          # 不传 --bundles，让 tauri.conf.json 里的 targets: ["dmg","app"] 生效
          npm run tauri build
        shell: bash

      - name: Print ALL bundle files (debug)
        run: find widget/src-tauri/target/release/bundle -type f | sort

      - name: Collect into ./release (never fail)
        continue-on-error: true
        run: |
          mkdir -p ./release
          cd widget/src-tauri/target/release/bundle

          echo "=== Copying DMG ==="
          find . -name "*.dmg" -exec cp -v {} ../../../release/ \; || true
          echo "=== Copying .app.tar.gz ==="
          find . -name "*.app.tar.gz" -exec cp -v {} ../../../release/ \; || true
          echo "=== Copying .sig ==="
          find . -name "*.app.tar.gz.sig" -exec cp -v {} ../../../release/ \; || true
          echo "=== Copying latest*.json ==="
          find . -name "latest*.json" -exec cp -v {} ../../../release/ \; || true

          echo ""
          echo "=== release/ final ==="
          ls -lh ../../../release/ 2>/dev/null || echo "(empty)"

      - uses: softprops/action-gh-release@v2
        if: ${{ always() }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Watermelon ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release/*
